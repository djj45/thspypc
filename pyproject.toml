[project]
name = "thspypc"
version = "0.1.0"
description = "同花顺 Windows PC 免费版行情协议纯 Python 实现（8901 端口登录）"
readme = "README.md"
authors = [
    { name = "djj45", email = "djj45djj46@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "a-trade-calendar>=1.0",
    "pycryptodome>=3.20.0",
    "qrcode>=8.2",
    "requests>=2.28",
]

[project.optional-dependencies]
qr = [
    "qrcode>=7.0",
]
dev = [
    "pytest>=8.0",
]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# package = false：不把 thspypc 当包构建安装（避免 uv_build 子进程被
# Windows AppLocker/WDAC 应用控制策略拦截，WinError 4551）。
# 测试脚本靠 sys.path.insert(0, "src") 找到源码，无需 editable 安装。
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
