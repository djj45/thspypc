[project]
name = "thspypc"
version = "0.1.0"
description = "同花顺 Windows PC 远航版行情协议纯 Python 实现（8901 端口登录）"
readme = "README.md"
authors = [
    { name = "djj45", email = "djj45djj46@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pycryptodome>=3.20.0",
    "requests>=2.28",
]

[project.optional-dependencies]
qr = [
    "qrcode>=7.0",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true
